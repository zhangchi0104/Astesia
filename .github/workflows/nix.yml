name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action needs this to replace the previous cache for the same key.
      actions: write

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build
        run: nix build .#astesia -L

      # The binaries link against the Nix store, so this artifact is for Nix users and debugging,
      # not a replacement for the portable archives from release.yml.
      - name: Collect build output
        run: cp -rL result astesia-nix

      - uses: actions/upload-artifact@v7
        with:
          name: astesia-nix-${{ runner.os }}
          path: astesia-nix

      # Reuses the build above, then runs the Clippy and rustfmt checks defined in flake.nix.
      - name: Flake check
        run: nix flake check -L

      # The dev shell is what contributors and other jobs use, so make sure it still builds Rust code.
      - name: Dev shell
        run: nix develop --command cargo --version
