name: Native packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach packages to
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: astesia-linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: astesia-windows-x64
          - platform: macos-15
            target: aarch64-apple-darwin
            artifact: astesia-macos-arm64
          - platform: macos-15
            target: x86_64-apple-darwin
            artifact: astesia-macos-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            g++ \
            gcc \
            libasound2-dev \
            libfontconfig-dev \
            libgit2-dev \
            libglib2.0-dev \
            libssl-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libsqlite3-dev \
            make

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Package Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: scripts/package-linux.sh "${{ matrix.target }}"

      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos') && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ vars.MACOS_CODESIGN_IDENTITY || secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/astesia-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          identity="$MACOS_CODESIGN_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" \
              | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity found in the certificate" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare macOS notarization key
        if: startsWith(matrix.platform, 'macos') && env.CODESIGN_IDENTITY != '' && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID || secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER || secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key"
          echo "NOTARY_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          echo "NOTARY_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Package macOS
        if: startsWith(matrix.platform, 'macos')
        run: scripts/package-macos.sh "${{ matrix.target }}"

      - name: Clean up macOS signing material
        if: always() && startsWith(matrix.platform, 'macos')
        run: |
          if [ -n "${CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$CODESIGN_KEYCHAIN" || true
          fi
          if [ -n "${NOTARY_API_KEY_PATH:-}" ]; then
            rm -f "$NOTARY_API_KEY_PATH"
          fi

      - name: Package Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: scripts/package-windows.ps1 -Target "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/package/*
          if-no-files-found: error

  release:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # semantic-release has already created the release with its notes;
          # a manually pushed tag gets a draft release as before.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/**/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Astesia $TAG" \
              --notes "Internal native packages." \
              artifacts/**/*
          fi
