name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Without a v* tag semantic-release starts over at 1.0.0, which would go
      # backwards from the version already in Cargo.toml.
      - name: Require a baseline tag
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            echo "No v* tag found. Push the tag of the current release before enabling semantic-release." >&2
            exit 1
          fi

      - name: Test version script
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          before="$(git tag --points-at HEAD --list 'v*')"
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/changelog@7.0.0 \
            -p @semantic-release/exec@7.1.0 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
          # @semantic-release/git tags the release commit it pushes, so a new
          # release shows up as a v* tag on the new HEAD.
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ] && [ "$tag" != "$before" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Tags pushed with GITHUB_TOKEN do not start other workflows, so the native
  # package build is called directly instead of relying on its tag trigger.
  packages:
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
